<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Badge de fundo -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Trilho do gauge (fundo do arco) -->
  <path d="M 20 58 A 30 30 0 0 1 80 58"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round"/>

  <!-- Progresso do gauge (0 a 78%) -->
  <path d="M 20 58 A 30 30 0 0 1 73.12 38.88"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Agulha -->
  <line x1="50" y1="58" x2="64.33" y2="46.14"
        stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Pino central -->
  <circle cx="50" cy="58" r="4.5" fill="#ffffff"/>

  <!-- Badge de checkmark na ponta (o "gabarito" / resultado certo) -->
  <circle cx="73.12" cy="38.88" r="11" fill="#22C55E" stroke="#4F46E5" stroke-width="2.5"/>
  <path d="M 68.5 39 L 72 42.5 L 78 35"
        fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
